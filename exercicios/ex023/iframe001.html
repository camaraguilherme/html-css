<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
</head>
<!--Configuracoes do Iframe:
    -Tamanho Padrao: 300x150
    -height: Altura do Iframe
    -Widht: largura do Iframe
    -Frameborder (pode ser colocado no <style> como uma configuracao de bordar configuracao de borda comum)
    -Tag "a" utilizada entre Iframes serve caso o iframe
    -->
<body>
    <h1>Testando o uso do iframe</h1>
    <p>Acessando o site do 

        <iframe src="https://www.cursoemvideo.com" frameborder="0">
            <a href="https://www.cursoemvideo.com"> Curso em Vídeo</a>
        </iframe>

        para aprender a programar.
    </p>
</body>
</html>
