<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        div.container{
            border: 3px solid red;
            height: 300px;
            display: grid;
            grid-template: auto auto auto / auto auto auto;
            gap: 10px;
            place-content: start center;
            place-content: space-evenly space-between;
        }
        div.itens{
            border: 3px solid green;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="itens">A</div>
        <div class="itens">B</div>
        <div class="itens">C</div>
        <div class="itens">D</div>
        <div class="itens">E</div>
        <div class="itens">F</div>
        <div class="itens">G</div>
        <div class="itens">H</div>
        <div class="itens">I</div>
    </div>
</body>
</html>
