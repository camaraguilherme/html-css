<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        div.container{
            border: 3px solid red;
            display: grid;
            grid-template-rows: repeat(3, 80px);
            grid-template-columns: 2fr 3fr 1fr;
            grid-auto-flow: column;
            grid-auto-columns: 120px;
            grid-auto-rows: 80px;
            gap: 10px;
            place-items: normal normal;
            place-content: normal normal;
        }
        div.itens{
            border: 3px solid green;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="itens">A</div>
        <div class="itens">B</div>
        <div class="itens">C</div>
        <div class="itens">D</div>
        <div class="itens">E</div>
        <div class="itens">F</div>
        <div class="itens">G</div>
        <div class="itens">H</div>
        <div class="itens">I</div>
        <div class="itens">J</div>
    </div>
</body>
</html>
