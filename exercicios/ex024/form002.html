<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de formulário</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Preencha os campos abaixo:</h1>
    <form action="cadastro.php" autocomplete="on">
        <p><label for="iusu">Usuário:</label>
        <input type="text" name="usuario" id="iusu" required="username" placeholder="nome de usuário" minlength="5" maxlength="15" size="10"></p>

        <p><label for="isen">Senha:</label>
        <input type="password" name="senha" id="isen" required autocomplete="current-password" minlength="8" maxlength="20" placeholder="Mín. 8 letras" size="10"></p>

        <p><input type="submit" value="Enviar"></p>
        <p><input type="reset" value="Limpar"></p>
    </form>
</body>
</html>
