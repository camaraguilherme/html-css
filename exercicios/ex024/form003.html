<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p><label for="ijogador">Jogador:</label>
        <input type="text" name="jogador" id="ijogador" required placeholder="Nome Completo" autocomplete="name"></p>

        <p><label for="igols">Gols:</label>
        <input type="number" name="gols" id="igols" required min="0" max="100" placeholder="0 a 100" step="1" value="1"></p>

        <p><label for="imes">Período:</label>
        <input type="month" name="mes" id="imes" value="2026-03"></p>

        <p><label for="idia">Dia:</label>
        <input type="date" name="dia" id="idia" value="2026-03-03"></p>

        <p><label for="ihora">Hora:</label>
        <input type="time" name="hora" id="ihora" value="21:30"></p>

        <p><input type="submit" value="Enviar"></p>
        <p><input type="reset" value="Limpar"></p>
    </form>
</body>
</html>
