<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        div.container{
            background-color: cadetblue;
            display: flex;
            flex-flow: row nowrap;
        }
        div.item{
            background-color: rgb(38, 0, 252);
            color: white;
            border: 1px solid white;
            text-align: center;
            flex-basis: 200px;
        }
        div#cxA{
            flex-shrink: 1;
            flex-grow: 0;
        }
        div#cxB{
            flex-shrink: 3;
            flex-grow: 1;
        }
        div#cxC{
            flex-shrink: 8;
            flex-grow: 4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">10</div>
        <div class="item" id="cxB">20</div>
        <div class="item" id="cxC">30</div>
    </div>
</body>
</html>
