<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        div.container{
            background-color: cadetblue;

            display: flex;
            flex-flow: row wrap;
        }
        div.item{
            background-color: rgb(38, 0, 252);
            color: white;
            border: 1px solid white;
            text-align: center;
            padding: 20px;
        }
        div#i1{
            order: -5;
        }
        div#i2{
            order: 5;
        }
        div#i3{
            order: 3;
        }
        div#i4{
            order: 1;
        }
        div#i5{
            order: -3;
        }
        div#i6{
            order: 0;
        }
        div#i7{
            order: -8;
        }
        div#i8{
            order: -2;
        }
        div#i9{
            order: 0;
        }
        div#i10{
            order: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">10</div>
        <div class="item" id="i2">20</div>
        <div class="item" id="i3">30</div>
        <div class="item" id="i4">40</div>
        <div class="item" id="i5">50</div>
        <div class="item" id="i6">60</div>
        <div class="item" id="i7">70</div>
        <div class="item" id="i8">80</div>
        <div class="item" id="i9">90</div>
        <div class="item" id="i10">100</div>
    </div>
</body>
</html>
