<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        div.container{
            background-color: cadetblue;

            display: flex;
            align-items: flex-start;
            flex-flow: row wrap;
            height: 400px;
        }
        div.item{
            background-color: rgb(38, 0, 252);
            color: white;
            border: 1px solid white;
            text-align: center;
            padding: 20px;
        }
        div#i1{
           
        }
        div#i2{
            align-self: center;
        }
        div#i3{
            
        }
        div#i4{
            align-self: flex-end;
        }
        div#i5{
           
        }
        div#i6{
            
        }
        div#i7{
            align-self: flex-start;
        }
        div#i8{
            
        }
        div#i9{
            align-self: center;
        }
        div#i10{
            align-self: stretch;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">10</div>
        <div class="item" id="i2">20</div>
        <div class="item" id="i3">30</div>
        <div class="item" id="i4">40</div>
        <div class="item" id="i5">50</div>
        <div class="item" id="i6">60</div>
        <div class="item" id="i7">70</div>
        <div class="item" id="i8">80</div>
        <div class="item" id="i9">90</div>
        <div class="item" id="i10">100</div>
    </div>
</body>
</html>
