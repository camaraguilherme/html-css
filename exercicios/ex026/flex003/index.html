<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        div.container{
            background-color: cadetblue;

           display: flex;
           flex-flow: row wrap;
        }
        div.item{
            background-color: rgb(38, 0, 252);
            color: white;
            border: 1px solid white;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de bloco 10</div>
        <div class="item">Exemplo de bloco 20</div>
        <div class="item">Exemplo de bloco 30</div>
        <div class="item">Exemplo de bloco 40</div>
        <div class="item">Exemplo de bloco 50</div>
        <div class="item">Exemplo de bloco 60</div>
        <div class="item">Exemplo de bloco 70</div>
        <div class="item">Exemplo de bloco 80</div>
        <div class="item">Exemplo de bloco 90</div>
        <div class="item">Exemplo de bloco 100</div>

        
    </div>
</body>
</html>
