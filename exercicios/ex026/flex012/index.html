<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        div.container{
            background-color: cadetblue;
            display: flex;
            flex-flow: row nowrap;
        }
        div.item{
            background-color: rgb(38, 0, 252);
            color: white;
            border: 1px solid white;
            text-align: center;
            flex-basis: 200px;
        }
        div#cxA{
            flex: 0 1 200px;
            /*flex-shrink: 1;
            flex-grow: 0;
            flex-basis: 200px;*/
        }
        div#cxB{
            flex: 1 3 150px;
            /*flex-shrink: 3;
            flex-grow: 1;
            flex-basis: 150px;*/
        }
        div#cxC{
            flex: 4 8 auto;
            /*flex-shrink: 8;
            flex-grow: 4;
            flex-basis: auto;*/
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">10</div>
        <div class="item" id="cxB">20</div>
        <div class="item" id="cxC">30</div>
    </div>
</body>
</html>
