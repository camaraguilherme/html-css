<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
            padding: 8px;
        }
        tr,th, td{
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }
        thead{
            background-color: darkgray;
            color: white;
        }
        .media{
            background-color: darkgray;
            color: white;
        }
        .num{
            background-color: rgba(255, 255, 0, 0.425);
        }

    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Médias</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td style="background-color: rgba(255, 0, 0, 0.425);">Matematica</td>
                <td class="num">0,0</td>
                <td class="num">0,0</td>
                <td class="num">0,0</td>
            </tr>   
            <tr>
                <td style="background-color: rgba(0, 0, 255, 0.425);">Física</td>
                <td class="num">0,0</td>                    
                <td class="num">0,0</td>
                <td class="num">0,0</td>
            </tr>
            <tr>
                <td style="background-color: rgba(137, 43, 226, 0.425);">Química</td>
                <td class="num">0,0</td>
                <td class="num">0,0</td>
                <td class="num">0,0</td>
            </tr>
            <tr>
                <td style="background-color: rgba(0, 128, 0, 0.425);">Biologia</td>
                <td class="num">0,0</td>
                <td class="num">0,0</td>
                <td class="num">0,0</td>
            </tr>
            <tr>
                <th colspan="4" class="media">Média de Exatas</th>
                <td class="media"><strong>0,0</strong></td>
            </tr>
            <tr>
                <th rowspan="2">Humanas</th>
                <td style="background-color: rgba(165, 42, 42, 0.425);">História</td>
                <td class="num">0,0</td>
                <td class="num">0,0</td>
                <td class="num">0,0</td>
            </tr>
            <tr>
                <td style="background-color: rgba(255, 166, 0, 0.425);">Geografia</td>
                <td class="num">0,0</td>
                <td class="num">0,0</td>
                <td class="num">0,0</td>
            </tr>
            <tr>
                <th colspan="4" class="media">Média de Humanas</th>
                <td class="media"><strong>0,0</strong></td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
